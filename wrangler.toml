#:schema node_modules/wrangler/config-schema.json
name = "bardic-torch-fe"
# wrangler 3.57.1's bundled workerd supports compatibility dates up to
# 2024-05-12; playwright.config.ts passes the same date to wrangler pages dev.
compatibility_date = "2024-05-12"
# AsyncLocalStorage for @sentry/cloudflare (functions/_middleware.ts): the
# narrow flag, not nodejs_compat. playwright.config.ts passes the same flags.
compatibility_flags = ["nodejs_als"]
pages_build_output_dir = "./build/client"

# This file is the source of truth for the Pages project's plain-text
# variables (the dashboard can't edit them while it exists). Secrets are
# never committed: AUTH_SESSION_SECRET, AUTH0_CLIENT_SECRET and the optional
# SENTRY_DSN are set per environment in the Pages dashboard, or in .dev.vars
# locally. See docs/DEPLOY.md.

######## PREVIEW environment (the `preview` branch only) ########
# Pages builds no other branch (docs/DEPLOY.md §2): previews share the
# production Auth0 application's secret and the production API.

[env.preview.vars]
BARDIC_TORCH_API_BASE_URL = "https://api.bardictorch.org"
AUTH0_DOMAIN = "bardictorch.us.auth0.com"
AUTH0_CLIENT_ID = "replace-with-the-auth0-client-id"
# The `preview` branch alias: Auth0 sends every preview sign-in back here.
AUTH0_DEFAULT_REDIRECT_URI = "https://preview.bardic-torch-fe.pages.dev"
AUTH0_AUDIENCE = "https://api.bardictorch.org"

######## PRODUCTION environment (main) ########

[env.production.vars]
BARDIC_TORCH_API_BASE_URL = "https://api.bardictorch.org"
AUTH0_DOMAIN = "bardictorch.us.auth0.com"
AUTH0_CLIENT_ID = "replace-with-the-auth0-client-id"
AUTH0_DEFAULT_REDIRECT_URI = "https://bardictorch.org"
AUTH0_AUDIENCE = "https://api.bardictorch.org"
