#:schema node_modules/wrangler/config-schema.json
name = "bardic-torch-fe"
# wrangler 3.57.1's bundled workerd supports compatibility dates up to 2024-05-12.
compatibility_date = "2024-05-12"
pages_build_output_dir = "./build/client"

# Secrets (AUTH_SESSION_SECRET, AUTH0_CLIENT_SECRET, SENTRY_DSN) are never
# committed; set them in the Pages dashboard or in .dev.vars.

######## PREVIEW environment config ########

[env.preview.vars]
BARDIC_TORCH_API_BASE_URL = "https://api.bardictorch.org"
AUTH0_DOMAIN = "bardictorch.us.auth0.com"
AUTH0_CLIENT_ID = "placeholder-client-id"
AUTH0_DEFAULT_REDIRECT_URI = "https://preview.bardic-torch-fe.pages.dev"
AUTH0_AUDIENCE = "https://api.bardictorch.org"

######## PRODUCTION environment config ########

[env.production.vars]
BARDIC_TORCH_API_BASE_URL = "https://api.bardictorch.org"
AUTH0_DOMAIN = "bardictorch.us.auth0.com"
AUTH0_CLIENT_ID = "placeholder-client-id"
AUTH0_DEFAULT_REDIRECT_URI = "https://bardictorch.org"
AUTH0_AUDIENCE = "https://api.bardictorch.org"
