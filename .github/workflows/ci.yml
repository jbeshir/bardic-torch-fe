# validate and e2e are required status checks on main, together with audit
# from .github/workflows/audit.yml (docs/DEPLOY.md, §1 "Before the first
# deploy", step "Protect main"). Neither job needs secrets: the e2e suite
# runs the built app against the local fixture API with stub sign-in, and
# never leaves the runner (see docs/TESTING.md).
#
# Every action is pinned to the full commit SHA of a release, with its tag in
# a trailing comment (test/repo-hygiene.test.ts requires both, and one pin per
# action across the workflows). These are the actions' Node 24 runtime
# releases (`runs.using: node24`). To bump one, read the new tag's commit
# (`gh api repos/actions/<name>/git/ref/tags/<tag>`) and change the SHA and
# the comment together, in every workflow.
name: CI

# Pull requests run once, as pull_request; pushes only for the two deployed
# branches, so a pull request's branch isn't tested twice. The audit runs on
# every push and pull request instead (audit.yml).
on:
  push:
    branches: [main, preview]
  pull_request:

permissions:
  contents: read

# Pull requests: a new push cancels the run it replaces. Pushes to a branch
# (main and preview deploy theirs) all run to the end, so every deployed
# commit keeps its own result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # No job pushes: the token is not left in .git/config while npm ci
        # runs install scripts.
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # npm 12, which package.json's packageManager names: its allowScripts
      # approvals decide which install scripts npm ci runs.
      - name: Set up npm
        run: npm install --global npm@12.2.1

      - name: Install dependencies
        run: npm ci

      # Every static check and vitest: the chain is package.json's
      # `validate` script (CLAUDE.md, "Validation").
      - name: Validate
        run: npm run validate

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    # The official Playwright image for the locked @playwright/test, pinned
    # by digest (the multi-arch index; the tag is for reading, the digest
    # decides): Chromium, its libraries and the system fonts are exactly
    # the sandbox's, so layout and screenshots match it. On the bare runner
    # system-ui was DejaVu Sans, not the image's WenQuanYi Zen Hei, and the
    # layout differed. Bump it with @playwright/test: the tag's version must
    # be the locked one (test/repo-hygiene.test.ts), and the digest is the
    # tag's multi-arch index: the top-level Digest of `docker buildx
    # imagetools inspect mcr.microsoft.com/playwright:<tag>`.
    # --ipc=host: Chromium's shared memory, as Playwright's Docker docs say.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
      options: --ipc=host
    timeout-minutes: 60
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # No job pushes: the token is not left in .git/config while npm ci
        # runs install scripts.
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # npm 12, which package.json's packageManager names: its allowScripts
      # approvals decide which install scripts npm ci runs.
      - name: Set up npm
        run: npm install --global npm@12.2.1

      - name: Install dependencies
        run: npm ci

      # Builds the e2e build (npm run build:e2e), then runs the suite.
      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: test-results/
          retention-days: 14
