# validate and e2e are required status checks on main (docs/DEPLOY.md, §1
# "Before the first deploy", step "Protect main"); audit is not required
# yet, because remix-auth (until stage 3's openid-client) and a dev
# dependency (postcss 8.5.3, until Tailwind 4) still carry advisories or
# deprecations. None needs
# secrets: the e2e suite runs the built app against the local fixture API
# with stub sign-in, and never leaves the runner (see docs/TESTING.md).
#
# Actions are pinned to exact release tags. Full commit SHAs (with the tag
# in a comment) would be stronger, but they were not resolvable when this
# file was written; pin them with Dependabot or `gh api` when they can be
# checked against the actions' repositories. These v4 majors run on Node 20,
# which GitHub is retiring for actions: move to the Node 24 majors
# (checkout v5, setup-node v5, upload-artifact v5 or later) together.
name: CI

# Pull requests run once, as pull_request; pushes only for the two deployed
# branches, so a pull request's branch isn't tested twice.
on:
  push:
    branches: [main, preview]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # npm 12, which package.json's packageManager names: its allowScripts
      # approvals decide which install scripts npm ci runs.
      - name: Set up npm
        run: npm install --global npm@12.2.1

      - name: Install dependencies
        run: npm ci

      # format:check, lint, typecheck, check:api, check:tokens,
      # check:contrast, vitest (unit, contract, scans) and check:prod-build.
      - name: Validate
        run: npm run validate

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Check out
        uses: actions/checkout@v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # npm 12, which package.json's packageManager names: its allowScripts
      # approvals decide which install scripts npm ci runs.
      - name: Set up npm
        run: npm install --global npm@12.2.1

      - name: Install dependencies
        run: npm ci

      # Installs the Chromium build that the locked @playwright/test
      # (1.61.1) expects, with its system libraries.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The prod phase (npm run build), then the stub phase (npm run
      # build:e2e); see scripts/e2e.mjs.
      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: screenshots
          path: e2e/screenshots/
          retention-days: 14

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: test-results
          path: test-results/
          retention-days: 14

  # Known advisories in the dependencies: any in a runtime dependency, or a
  # high or critical one anywhere, fails npm run audit. Then the registry
  # signatures and provenance of every installed package are checked.
  audit:
    name: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # npm 12, which package.json's packageManager names: its allowScripts
      # approvals decide which install scripts npm ci runs.
      - name: Set up npm
        run: npm install --global npm@12.2.1

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm run audit

      - name: Verify registry signatures
        run: npm audit signatures
