# validate and e2e are required status checks on main, together with audit
# from .github/workflows/audit.yml (docs/DEPLOY.md, §1 "Before the first
# deploy", step "Protect main"). Neither job needs secrets: the e2e suite
# runs the built app against the local fixture API with stub sign-in, and
# never leaves the runner (see docs/TESTING.md).
#
# Every action is pinned to the full commit SHA of a release, with its tag in
# a trailing comment (test/repo-hygiene.test.ts requires both, and one pin per
# action across the workflows). These are the actions' Node 24 runtime
# releases (`runs.using: node24`). To bump one, read the new tag's commit
# (`gh api repos/actions/<name>/git/ref/tags/<tag>`) and change the SHA and
# the comment together, in every workflow.
name: CI

# Pull requests run once, as pull_request; pushes only for the two deployed
# branches, so a pull request's branch isn't tested twice. The audit runs on
# every push and pull request instead (audit.yml).
on:
  push:
    branches: [main, preview]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # npm 12, which package.json's packageManager names: its allowScripts
      # approvals decide which install scripts npm ci runs.
      - name: Set up npm
        run: npm install --global npm@12.2.1

      - name: Install dependencies
        run: npm ci

      # Every static check and vitest: the chain is package.json's
      # `validate` script (CLAUDE.md, "Validation").
      - name: Validate
        run: npm run validate

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # npm 12, which package.json's packageManager names: its allowScripts
      # approvals decide which install scripts npm ci runs.
      - name: Set up npm
        run: npm install --global npm@12.2.1

      - name: Install dependencies
        run: npm ci

      # Installs the Chromium build that the locked @playwright/test
      # (1.61.1) expects, with its system libraries.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The prod phase (npm run build), then the stub phase (npm run
      # build:e2e); see scripts/e2e.mjs.
      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: e2e/screenshots/
          retention-days: 14

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: test-results/
          retention-days: 14
