# Both jobs are required status checks on main (docs/DEPLOY.md, "Branch
# protection"). Neither needs secrets: the e2e suite runs the built app
# against the local fixture API with stub sign-in, and never leaves the
# runner (see docs/TESTING.md).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # format:check, lint, typecheck, check:api, check:tokens,
      # check:contrast, vitest (unit, contract, scans) and check:prod-build.
      - name: Validate
        run: npm run validate

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Check out
        uses: actions/checkout@v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Installs the Chromium build that the locked @playwright/test
      # (1.61.1) expects, with its system libraries.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The prod phase (npm run build), then the stub phase (npm run
      # build:e2e); see scripts/e2e.mjs.
      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: screenshots
          path: e2e/screenshots/
          retention-days: 14

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: test-results
          path: test-results/
          retention-days: 14
