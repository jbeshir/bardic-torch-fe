    RevisionSummary:
      type: object
      description: A public revision, as an entity's history lists it.
      additionalProperties: false
      required: [id, source, summary, author, contributors, created_at]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          description: The revision's ID, its address.
          examples:
            - 42
        source:
          $ref: "#/components/schemas/RevisionSource"
        summary:
          type: string
          description: What the revision changed, in its author's words; may be empty.
          examples:
            - Credit the tune.
        author:
          description: Who wrote the revision, or null for one with no author, such as an import.
          oneOf:
            - $ref: "#/components/schemas/RevisionAuthor"
            - type: "null"
        contributors:
          type: array
          description: The wiki users who wrote an imported revision, in order; empty for other revisions.
          items:
            type: string
            examples:
              - Archivist
        created_at:
          type: string
          format: date-time
          description: When the revision was created.
          examples:
            - "2026-10-01T09:00:00Z"
      examples:
        - id: 42
          source: import
          summary: ""
          author: null
          contributors: [Archivist, Lorekeeper]
          created_at: "2026-01-01T00:00:00Z"

