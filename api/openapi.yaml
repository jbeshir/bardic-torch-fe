          description_md: null
          region: null
          parent: null
          is_bardic_resource: true
          enumerable: pdf

    EventSnapshot:
      type: object
      description: The view of an event snapshot.
      additionalProperties: false
      required: [name, kind, description_md]
      properties:
        name:
          $ref: "#/components/schemas/EventSummary/properties/name"
        kind:
          $ref: "#/components/schemas/EventKind"
        description_md:
          $ref: "#/components/schemas/Event/properties/description_md"
      examples:
        - name: Midwinter Revel
          kind: event
          description_md: null

    NeedsWorkReason:
      type: string
      description: |
        Why an entry needs work: it is a `stub`; its conservation status is `unassessed`; its licensing is
        unknown (`missing_licensing`); or a visible link attached to it is dead (`dead_links`).
      enum: [stub, unassessed, missing_licensing, dead_links]
      examples:
        - stub

    NeedsWorkList:
      type: object
      description: One page of the public pieces and persons needing work, pieces first, each by sort key.
      additionalProperties: false
      required: [data, total, counts]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/NeedsWorkEntry"
        total:
          type: integer
          format: int64
          minimum: 0
          description: How many entries need work for the requested reason, or any reason, in all.
          examples:
            - 1
        counts:
          type: array
          description: How many entries need work for each reason, whatever the requested reason, in the enum's order.
          items:
            $ref: "#/components/schemas/NeedsWorkCount"
      examples:
        - data:
            - entity_type: piece
              slug: the-copper-kettle
              title: The Copper Kettle
              reasons: [stub, missing_licensing]
          total: 1
          counts:
            - reason: stub
              count: 1
            - reason: unassessed
              count: 0
            - reason: missing_licensing
              count: 1
            - reason: dead_links
              count: 0

    NeedsWorkEntry:
      type: object
      description: A public piece or person needing work.
      additionalProperties: false
      required: [entity_type, slug, title, reasons]
      properties:
        entity_type:
          type: string
          description: Whether the entry is a piece or a person.
          enum: [piece, person]
          examples:
            - piece
        slug:
          type: string
          description: The piece's or person's address.
          examples:
            - the-copper-kettle
        title:
          type: string
          description: The piece's title or the person's name.
          examples:
            - The Copper Kettle
        reasons:
          type: array
          description: Every reason the entry needs work, in the enum's order.
          minItems: 1
          items:
            $ref: "#/components/schemas/NeedsWorkReason"
      examples:
        - entity_type: person
          slug: wren-of-the-vale
          title: Wren of the Vale
          reasons: [dead_links]

    NeedsWorkCount:
      type: object
      description: How many entries need work for a reason.
      additionalProperties: false
      required: [reason, count]
      properties:
        reason:
          $ref: "#/components/schemas/NeedsWorkReason"
        count:
          type: integer
          format: int64
          minimum: 0
          examples:
            - 3
      examples:
        - reason: stub
          count: 3

    Resolution:
      type: object
      description: How a moderator closed a contact request.
      additionalProperties: false
      required: [resolved_by, resolved_at, note]
      properties:
        resolved_by:
          type: string
          description: The moderator's user `id`.
          examples:
            - google-oauth2|123
        resolved_at:
          type: string
          format: date-time
        note:
          type:
            - string
            - "null"
          examples:
            - Link hidden.
      examples:
        - resolved_by: google-oauth2|123
          resolved_at: "2026-11-11T12:00:00Z"
          note: Link hidden.

    CloseContactRequestRequest:
      type: object
      description: The body of a moderator's closing of a contact request.
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [resolved, dismissed]
          examples:
            - dismissed
        note:
          type:
            - string
            - "null"
          maxLength: 2000
          examples:
            - Not for us.
      examples:
        - status: dismissed
          note: Not for us.

    ModerationLink:
      type: object
      description: A link as a moderator takes it down, hidden or not.
      additionalProperties: false
      required: [id, url, title, is_hidden, liveness, attachments]
      properties:
        id:
          type: integer
          format: int64
          examples:
            - 9
        url:
          type: string
          examples:
            - https://example.org/kettle
        title:
          type:
            - string
            - "null"
          examples:
            - The Copper Kettle, sung
        is_hidden:
          type: boolean
          examples:
            - false
        liveness:
          $ref: "#/components/schemas/Liveness"
        attachments:
          type: array
          description: The pieces, then persons, the link is attached to, with its roles on each.
          items:
            type: object
            additionalProperties: false
            required: [entity_type, slug, title, roles]
            properties:
              entity_type:
                type: string
                enum: [piece, person]
                examples:
                  - piece
              slug:
                type: string
                examples:
                  - the-copper-kettle
              title:
                type: string
                description: The attached piece's title or person's name.
                examples:
                  - The Copper Kettle
              roles:
                type: array
                items:
                  $ref: "#/components/schemas/LinkRole"
      examples:
        - id: 9
          url: https://example.org/kettle
          title: The Copper Kettle, sung
          is_hidden: false
          liveness: ok
          attachments:
            - entity_type: piece
              slug: the-copper-kettle
              title: The Copper Kettle
              roles: [lyrics]

    SetLinkHiddenRequest:
      type: object
      description: The body of a request to hide or restore a link.
      additionalProperties: false
      required: [hidden]
      properties:
        hidden:
          type: boolean
          description: True to hide the link, false to restore it.
          examples:
            - true
      examples:
        - hidden: true

    CreateContactRequest:
      type: object
      description: The body of a contact request. Every text field is trimmed.
      additionalProperties: false
      required: [kind, email, message, turnstile_token]
      properties:
        kind:
          type: string
          description: |
            What the request is about. `link_report` reports a link on the site, and `url` is then the link's URL.
            Moderators take a link down by finding it with `GET /v1/moderation/links`.
          enum: [takedown, opt_out, correction, link_report, general]
          examples:
            - takedown
        name:
          type:
            - string
            - "null"
          maxLength: 255
          examples:
            - Wren
        email:
          type: string
          maxLength: 254
          examples:
            - wren@example.org
        message:
          type: string
          minLength: 1
          maxLength: 5000
          examples:
            - Please remove this recording.
        url:
          type:
            - string
            - "null"
          maxLength: 2048
          description: The page the request is about, if any, or for a `link_report` the link's URL. Stored as sent.
          examples:
            - https://example.org/kettle
        turnstile_token:
          type: string
          minLength: 1
          maxLength: 2048
          description: The token Cloudflare Turnstile's widget (action `contact`) gave the browser.
          examples:
            - 0.abc123
      examples:
        - kind: takedown
          name: Wren
          email: wren@example.org
          message: Please remove this recording.
          url: https://example.org/kettle
          turnstile_token: 0.abc123

    ContactRequest:
      type: object
      description: |
        A message sent through the contact form. The name and URL are null when the sender gave
        none.
      additionalProperties: false
      required: [id, kind, name, email, message, url, status, created_at, resolution]
      properties:
        id:
          type: integer
          format: int64
          examples:
            - 3
        kind:
          type: string
          enum: [takedown, opt_out, correction, link_report, general]
          examples:
            - takedown
        name:
          type:
            - string
            - "null"
          examples:
            - Wren
        email:
          type:
            - string
            - "null"
          examples:
            - wren@example.org
        message:
          type:
            - string
            - "null"
          examples:
            - Please remove this recording.
        url:
          type:
            - string
            - "null"
          examples:
            - https://example.org/kettle
        status:
          type: string
          enum: [open, resolved, dismissed]
          examples:
            - open
        created_at:
          type: string
          format: date-time
        resolution:
          oneOf:
            - $ref: "#/components/schemas/Resolution"
            - type: "null"
      examples:
        - id: 3
          kind: takedown
          name: Wren
          email: wren@example.org
          message: Please remove this recording.
          url: https://example.org/kettle
          status: open
          created_at: "2026-11-10T09:30:00Z"
          resolution: null

    ContactRequestList:
      type: object
      description: One page of contact requests, oldest first.
      additionalProperties: false
      required: [data, total]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ContactRequest"
        total:
          type: integer
          format: int64
          minimum: 0
          description: How many requests have the status, over every page.
          examples:
            - 1
      examples:
        - data:
            - id: 3
              kind: takedown
              name: Wren
              email: wren@example.org
              message: Please remove this recording.
              url: https://example.org/kettle
              status: open
              created_at: "2026-11-10T09:30:00Z"
              resolution: null
          total: 1

    EntityType:
      type: string
      description: The type of entity a revision edits.
      enum: [piece, person, term, collection, event]
      examples:
        - piece

    RevisionStatus:
      type: string
      description: |
        Where a revision is in moderation: `pending` review, `approved`, `rejected` by a moderator, or `withdrawn` by
        its author (or by their later submission for the same entity).
      enum: [pending, approved, rejected, withdrawn]
      examples:
        - pending

    ProblemCode:
      type: string
      description: What is wrong with a field of a submitted document.
      enum:
        - required
        - too_long
        - not_nfc
        - control_character
        - duplicate
        - invalid
        - out_of_range
        - cycle
        - too_deep
        - wrong_facet
        - unknown_reference
        - source_required
        - prefers_no_page
      examples:
        - required

    Problem:
      type: object
      description: |
        A problem with a field of a submitted document, at its path in the editor format (`credits[2].person_slug`);
        `summary` is the revision's summary.
      additionalProperties: false
      required: [path, code]
      properties:
        path:
          type: string
          examples:
            - title
        code:
          $ref: "#/components/schemas/ProblemCode"
      examples:
        - path: title
          code: required

    ValidationFailed:
      type: object
      description: The error body of a document that does not validate.
      additionalProperties: false
      required: [code, message, problems]
      properties:
        code:
          type: string
