          description_verbatim: Sung at Midwinter Revel by Morwen.
          performer_slugs: [morwen]

    EditorPieceLink:
      type: object
      description: |
        A link attached to a piece, by URL, with the roles it has there and the performances of the piece it
        records. Its hidden state and liveness are not the document's.
