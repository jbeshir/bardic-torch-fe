        message:
          $ref: "#/components/schemas/Error/properties/message"
        problems:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Problem"
      examples:
        - code: validation_failed
          message: the document does not validate
          problems:
            - path: title
              code: required

    DuplicateMatch:
      type: object
      description: A public entity a new one may duplicate, by `slug` (a collection by `collection_id`).
      additionalProperties: false
      required: [entity_type, slug, collection_id, name]
      properties:
        entity_type:
          $ref: "#/components/schemas/EntityType"
        slug:
          type: [string, "null"]
          examples:
            - the-copper-kettle
        collection_id:
          type: [integer, "null"]
          format: int64
          minimum: 1
          examples:
            - null
        name:
          type: string
          description: The entity's title or name.
          examples:
            - The Copper Kettle
      examples:
        - entity_type: piece
          slug: the-copper-kettle
          collection_id: null
          name: The Copper Kettle

    PossibleDuplicate:
      type: object
      description: The error body of a new entity that may duplicate public ones.
      additionalProperties: false
      required: [code, message, possible_duplicates]
      properties:
        code:
          type: string
          enum: [possible_duplicate]
