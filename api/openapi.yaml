        year:
          type: [integer, "null"]
          examples:
            - 2019
        uploader:
          type: [string, "null"]
          examples:
            - Morwen
        description_verbatim:
          type: string
          description: How the source describes the performance, word for word.
          examples:
            - Sung at Midwinter Revel by Morwen.
        performer_slugs:
          type: array
          items:
            $ref: "#/components/schemas/EditorSlug"
      examples:
        - event_slug: midwinter-revel
