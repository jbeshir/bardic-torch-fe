          oneOf:
            - $ref: "#/components/schemas/PieceSummary"
            - type: "null"
        year:
          $ref: "#/components/schemas/PiecePerformance/properties/year"
        uploader:
          $ref: "#/components/schemas/PiecePerformance/properties/uploader"
        description_verbatim:
          $ref: "#/components/schemas/PiecePerformance/properties/description_verbatim"
        event:
          $ref: "#/components/schemas/PiecePerformance/properties/event"
        performers:
          $ref: "#/components/schemas/PiecePerformance/properties/performers"
      examples:
        - piece: null
          year: 2025
          uploader: null
          description_verbatim: Wren tells a winter tale
          event: null
          performers: []

    PersonSnapshot:
      type: object
      description: |
        The view of a person snapshot. `profile` is null, and `is_stub` true, for a person who prefers not to
        have a page, now or in the snapshot: only their identity is shown.
      additionalProperties: false
      required: [name, kind, status, status_date, status_source_url, is_stub, profile]
      properties:
        name:
          $ref: "#/components/schemas/PersonSummary/properties/name"
        kind:
          $ref: "#/components/schemas/PersonKind"
        status:
          $ref: "#/components/schemas/PersonStatus"
        status_date:
          $ref: "#/components/schemas/Person/properties/status_date"
        status_source_url:
          $ref: "#/components/schemas/Person/properties/status_source_url"
        is_stub:
          $ref: "#/components/schemas/PersonSummary/properties/is_stub"
        profile:
          description: Everything the snapshot shows beyond the person's identity.
          oneOf:
            - $ref: "#/components/schemas/PersonSnapshotProfile"
            - type: "null"
      examples:
        - name: Hollis Fenn
          kind: community_bard
          status: prefers_no_page
          status_date: "2026-03-01"
          status_source_url: https://example.org/requests/12
          is_stub: true
          profile: null

    PersonSnapshotProfile:
      type: object
      description: Everything a person snapshot shows beyond the person's identity.
      additionalProperties: false
      required:
        - pronouns
        - notes_md
        - licensing_status
        - licensing_notes_md
        - aliases
        - roles
        - affiliations
        - relations
        - links
      properties:
        pronouns:
          $ref: "#/components/schemas/PersonProfile/properties/pronouns"
        notes_md:
          $ref: "#/components/schemas/PersonProfile/properties/notes_md"
        licensing_status:
          $ref: "#/components/schemas/LicensingStatus"
        licensing_notes_md:
          $ref: "#/components/schemas/PersonProfile/properties/licensing_notes_md"
        aliases:
          type: array
          description: The snapshot's public aliases that are public aliases of the person now.
          items:
            $ref: "#/components/schemas/PersonAlias"
        roles:
          type: array
          description: What the person does, in the snapshot's order.
          items:
            $ref: "#/components/schemas/PersonRole"
        affiliations:
          type: array
          description: The person's affiliation terms that are public now, in the snapshot's order.
          items:
            $ref: "#/components/schemas/TermSummary"
        relations:
          type: array
          description: |
            The person's relations to other persons who are public and do not prefer no page now; a snapshot holds
            outgoing ones only.
          items:
            $ref: "#/components/schemas/SnapshotPersonRelation"
        links:
          type: array
          description: The snapshot's links that are not hidden now, in order.
          items:
            $ref: "#/components/schemas/SnapshotPersonLink"
      examples:
        - pronouns: null
          notes_md: null
          licensing_status: unknown
          licensing_notes_md: null
          aliases: []
          roles: [singer]
          affiliations: []
          relations: []
          links: []

    SnapshotPersonRelation:
      type: object
      description: A relation of a person snapshot's person to another public person with a page.
      additionalProperties: false
      required: [type, person]
      properties:
        type:
          $ref: "#/components/schemas/PersonRelationType"
        person:
          $ref: "#/components/schemas/PersonSummary"
      examples:
        - type: member_of
          person:
            slug: the-northmarch-bards
            name: The Northmarch Bards
            kind: group
            is_stub: false

    TermSnapshot:
      type: object
      description: The view of a term snapshot.
      additionalProperties: false
      required: [facet, name, display_name, parent, related_affiliation, description_md, position, aliases]
      properties:
        facet:
          $ref: "#/components/schemas/Facet"
        name:
          $ref: "#/components/schemas/TermListItem/properties/name"
        display_name:
          $ref: "#/components/schemas/TermSummary/properties/display_name"
        parent:
          description: The term's parent, if it is public now.
          oneOf:
            - $ref: "#/components/schemas/TermSummary"
            - type: "null"
        related_affiliation:
          description: The affiliation term the term implies, if it is public now.
          oneOf:
            - $ref: "#/components/schemas/TermSummary"
            - type: "null"
        description_md:
          $ref: "#/components/schemas/Term/properties/description_md"
        position:
          type: integer
          format: int32
          description: Where the term sorts among its siblings.
          examples:
            - 0
        aliases:
          $ref: "#/components/schemas/Term/properties/aliases"
      examples:
        - facet: topic
          name: Swords
          display_name: Swords
          parent: null
          related_affiliation: null
          description_md: null
          position: 0
          aliases: []

    CollectionSnapshot:
      type: object
      description: The view of a collection snapshot.
      additionalProperties: false
      required: [name, url, kind, description_md, region, parent, is_bardic_resource, enumerable]
      properties:
        name:
          $ref: "#/components/schemas/CollectionRef/properties/name"
        url:
          $ref: "#/components/schemas/CollectionSummary/properties/url"
        kind:
          $ref: "#/components/schemas/CollectionKind"
        description_md:
          $ref: "#/components/schemas/Collection/properties/description_md"
        region:
          description: The term for the region the collection is from, if it is public now.
          oneOf:
            - $ref: "#/components/schemas/TermSummary"
            - type: "null"
        parent:
          description: The collection this one is part of, if it is public now.
          oneOf:
            - $ref: "#/components/schemas/CollectionSummary"
            - type: "null"
        is_bardic_resource:
          $ref: "#/components/schemas/CollectionSummary/properties/is_bardic_resource"
        enumerable:
          $ref: "#/components/schemas/CollectionEnumerable"
      examples:
        - name: The Northmarch Songbook
          url: https://example.org/songbook.pdf
          kind: songbook_pdf
          description_md: null
          region: null
          parent: null
          is_bardic_resource: true
          enumerable: pdf

    EventSnapshot:
      type: object
      description: The view of an event snapshot.
      additionalProperties: false
      required: [name, kind, description_md]
      properties:
        name:
          $ref: "#/components/schemas/EventSummary/properties/name"
        kind:
          $ref: "#/components/schemas/EventKind"
        description_md:
          $ref: "#/components/schemas/Event/properties/description_md"
      examples:
        - name: Midwinter Revel
          kind: event
          description_md: null

    NeedsWorkReason:
      type: string
      description: |
        Why an entry needs work: it is a `stub`; its conservation status is `unassessed`; its licensing is
        unknown (`missing_licensing`); or a visible link attached to it is dead (`dead_links`).
      enum: [stub, unassessed, missing_licensing, dead_links]
      examples:
        - stub

    NeedsWorkList:
      type: object
      description: One page of the public pieces and persons needing work, pieces first, each by sort key.
      additionalProperties: false
      required: [data, total, counts]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/NeedsWorkEntry"
        total:
          type: integer
          format: int64
          minimum: 0
          description: How many entries need work for the requested reason, or any reason, in all.
          examples:
            - 1
        counts:
          type: array
          description: How many entries need work for each reason, whatever the requested reason, in the enum's order.
          items:
            $ref: "#/components/schemas/NeedsWorkCount"
      examples:
        - data:
            - entity_type: piece
              slug: the-copper-kettle
              title: The Copper Kettle
              reasons: [stub, missing_licensing]
          total: 1
          counts:
            - reason: stub
              count: 1
            - reason: unassessed
              count: 0
            - reason: missing_licensing
              count: 1
            - reason: dead_links
              count: 0

    NeedsWorkEntry:
      type: object
      description: A public piece or person needing work.
      additionalProperties: false
      required: [entity_type, slug, title, reasons]
      properties:
        entity_type:
          type: string
          description: Whether the entry is a piece or a person.
          enum: [piece, person]
          examples:
            - piece
        slug:
          type: string
          description: The piece's or person's address.
          examples:
            - the-copper-kettle
        title:
          type: string
          description: The piece's title or the person's name.
          examples:
            - The Copper Kettle
        reasons:
          type: array
          description: Every reason the entry needs work, in the enum's order.
          minItems: 1
          items:
            $ref: "#/components/schemas/NeedsWorkReason"
      examples:
        - entity_type: person
          slug: wren-of-the-vale
          title: Wren of the Vale
          reasons: [dead_links]

    NeedsWorkCount:
      type: object
      description: How many entries need work for a reason.
      additionalProperties: false
      required: [reason, count]
      properties:
        reason:
          $ref: "#/components/schemas/NeedsWorkReason"
        count:
          type: integer
          format: int64
          minimum: 0
          examples:
            - 3
      examples:
        - reason: stub
          count: 3
