        title:
          type: [string, "null"]
          examples:
            - The Copper Kettle, sung at Midwinter
        description:
          type: [string, "null"]
          examples:
            - A recording from the revel.
        platform:
          type: [string, "null"]
          examples:
            - example.org
        place_type:
          oneOf:
            - $ref: "#/components/schemas/LinkPlaceType"
            - type: "null"
        collection_id:
          type: [integer, "null"]
          format: int64
          minimum: 1
          description: The collection the link belongs to, by its `id`.
          examples:
            - 12
        locator:
          type: [string, "null"]
          description: Where in the collection this piece appears, such as a page number.
          examples:
            - p. 12
        roles:
          type: array
          items:
            $ref: "#/components/schemas/LinkRole"
        performances:
          type: array
          items:
            $ref: "#/components/schemas/EditorPerformance"
      examples:
        - url: https://example.org/the-copper-kettle
          title: null
          description: null
          platform: null
          place_type: null
          collection_id: null
          locator: null
          roles: [performance]
          performances: []

    EditorPieceDocument:
      type: object
      description: |
        A piece's document in the editor format: the stored document's fields, with references to pieces, persons,
        terms and events by slug (collections by ID).
      additionalProperties: false
      required: [schema_version, title, kind, secondary_kinds, conservation, is_stub, notes_md, version_notes_md,
