  /v1/contact:
    post:
      tags:
        - Moderation
      summary: Send a contact request
      description: |
        Sends a message to the moderators, from anyone, with no account. The Cloudflare Turnstile token is checked
        with Cloudflare: it must pass, have been minted on the site's hostname and for the action `contact`;
        otherwise the answer is 400 `turnstile_failed`. The name, email, message and URL are personal data: the
        server never logs them. Credentials are
        ignored. The body is at most 64 KiB.
      operationId: createContactRequest
      security: []
      requestBody:
        description: The message and its Turnstile token.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateContactRequest"
      responses:
        "202":
          description: The request was stored.
        "400":
          description: |
            The body is invalid (`invalid_request`), or the Turnstile check failed (`turnstile_failed`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalid:
                  summary: A field is missing or out of range
                  value:
                    code: invalid_request
                    message: kind, email, message and turnstile_token are required and within their limits
                turnstile:
                  summary: The Turnstile check failed
                  value:
                    code: turnstile_failed
                    message: the Turnstile check failed; reload the form and try again
        "413":
          description: The request body is larger than 64 KiB; the error code is `request_too_large`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: request_too_large
                message: request body is too large
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"

