openapi: 3.1.0
info:
  title: Bardic Torch API
  description: |
    API behind bardictorch.org.

    Conventions:
    - Request and response bodies are JSON (`application/json`); property names are snake_case.
    - Response objects are closed (`additionalProperties: false`): clients can rely on receiving exactly the
      documented properties.
    - Errors use the `Error` body, whose `code` is stable and machine-readable; `message` is for humans.
    - A path no operation matches gets 404 `not_found`; a known path with an unsupported method gets 405
      `method_not_allowed` with an `Allow` header listing the supported methods. Neither authenticates the
      request.
    - Request headers over 16 KiB get a plain-text 431 from the server, before any operation runs.
    - A request whose path is not validly percent-encoded gets a plain-text 400 from the server, before any
      operation runs.
    - operationIds are camelCase.
  version: 1.0.0
  contact:
    name: Bardic Torch
    url: https://bardictorch.org
  license:
    name: MIT
    identifier: MIT

servers:
  - url: https://api.bardictorch.org
    description: Production server

security:
  - auth0Bearer: []
  - apiTokenBearer: []

tags:
  - name: Health
    description: Liveness and readiness checks for the deployment platform
  - name: Users
    description: The caller's account
  - name: Moderation
    description: Actions reserved for moderators
  - name: API tokens
    description: Personal API tokens for programmatic access
  - name: Catalogue
    description: |
      Public reads of the catalogue: pieces, persons, the terms that classify them, and the collections and
      events that record them

paths:
  /healthz:
    get:
      tags:
        - Health
      summary: Liveness check
      description: |
        Reports that the process is serving requests. Always 200 while the server runs; it does not check
        dependencies. Credentials are ignored.
      operationId: getHealthz
      security: []
      responses:
        "200":
          description: The server is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /readyz:
    get:
      tags:
        - Health
      summary: Readiness check
      description: |
        Reports whether the server can handle requests, by checking that the database answers within two
        seconds. The deployment platform uses it as the startup health check. Credentials are ignored.
      operationId: getReadyz
      security: []
      responses:
        "200":
          description: The server and its database are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: The database is unreachable; the error code is `unavailable`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"


  /v1/me:
    get:
      tags:
        - Users
      summary: Get the caller
      description: |
        Returns the caller's user. A user is created as a contributor with a default display name on their first
        authenticated request, so this succeeds for any valid credential that is not blocked.
      operationId: getMe
      responses:
        "200":
          description: The caller's user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Internal"
    patch:
      tags:
        - Users
      summary: Update the caller
      description: Sets the caller's display name and returns the updated user.
      operationId: updateMe
      requestBody:
        description: The fields to update.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: The caller's updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: |
            The request body is malformed, or the display name is invalid after normalisation; the error code is
            `invalid_request`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: invalid_request
                message: "invalid display name: must be at most 64 characters"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/users/{user_id}/blocked:
    put:
      tags:
        - Moderation
      summary: Block or unblock a user
      description: |
        Blocks or unblocks a contributor and returns them. A blocked user gets 403 `user_blocked` from every
        authenticated endpoint. Blocking a blocked user, or unblocking one who is not blocked, succeeds again;
        a re-block keeps the time the user was first blocked. Moderators cannot be blocked or unblocked,
        including by themselves. Requires the moderator role.

        Until users can be found through the API, moderators take user IDs from Auth0 or the database.
      operationId: setUserBlocked
      parameters:
        - name: user_id
          in: path
          required: true
          description: |
            The user's `id`, percent-encoded: its `|` is sent as `%7C`, as in `google-oauth2%7C123`.
          schema:
            type: string
            examples:
              - google-oauth2|123
      requestBody:
        description: Whether the user should be blocked.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetUserBlockedRequest"
            examples:
              block:
                summary: Block the user
                value:
                  blocked: true
              unblock:
                summary: Unblock the user
                value:
                  blocked: false
      responses:
        "200":
          description: The user is now blocked or unblocked, as requested.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ModeratorForbidden"
        "404":
          description: There is no user with this ID; the error code is `not_found`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: not_found
                message: user not found
        "409":
          description: The user is a moderator, possibly the caller; the error code is `conflict`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: conflict
                message: moderators cannot be blocked or unblocked
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/tokens:
    post:
      tags:
        - API tokens
      summary: Create an API token
      description: |
        Creates a personal API token for the caller and returns its secret, which is shown only in this response.
        A user may have at most 10 active tokens; the limit is checked before the token is stored, so concurrent
        requests can exceed it. Requires Auth0 authentication: API tokens cannot create tokens.
      operationId: createAPIToken
      security:
        - auth0Bearer: []
      requestBody:
        description: The token to create. Send `{}` to create a token without a name.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAPITokenRequest"
            examples:
              named:
                summary: A named token
                value:
                  name: CI runner
              unnamed:
                summary: A token without a name
                value: {}
      responses:
        "201":
          description: The token was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedAPIToken"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/APITokenForbidden"
        "409":
          description: The caller already has 10 active tokens; the error code is `token_limit_reached`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: token_limit_reached
                message: user has reached the maximum number of active API tokens
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/Internal"
    get:
      tags:
        - API tokens
      summary: List API tokens
      description: |
        Lists the caller's active (not revoked) API tokens, newest first. Secrets are never included. Requires
        Auth0 authentication: API tokens cannot list tokens.
      operationId: listAPITokens
      security:
        - auth0Bearer: []
      responses:
        "200":
          description: The caller's active tokens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APITokenList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/APITokenForbidden"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/tokens/{token_id}:
    delete:
      tags:
        - API tokens
      summary: Revoke an API token
      description: |
        Revokes one of the caller's API tokens, which then no longer authenticates requests. Revoking a token that
        is already revoked succeeds again. Requires Auth0 authentication: API tokens cannot revoke tokens.
      operationId: revokeAPIToken
      security:
        - auth0Bearer: []
      parameters:
        - name: token_id
          in: path
          required: true
          description: |
            The token's `id`: a UUID in canonical form, lowercase and hyphenated. Any other value names no token.
          schema:
            type: string
            examples:
              - 6f1c1f0e-8a4b-4f43-9a5e-2d7c0b1e3a55
      responses:
        "204":
          description: The token is revoked.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/APITokenForbidden"
        "404":
          description: |
            The caller has no token with this ID, or the ID is not a canonical UUID; the error code is `not_found`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: not_found
                message: API token not found
        "500":
          $ref: "#/components/responses/Internal"

  /v1/pieces:
    get:
      tags:
        - Catalogue
      summary: Search pieces
      description: |
        Searches the public pieces, returning one page of them with how many match in all and the facet counts.
        Every filter given must match. `term`s are grouped by their facet: a piece matches a facet if it is
        tagged with any of its terms or any of their descendants, and must match every facet given. `kind`,
        `conservation_status` and their values work the same way, as two more facets.

        Facet counts are disjunctive: a value's count is how many pieces match every filter except the values
        selected in its own facet, and match the value (a term with its descendants, each piece counted once).
        Only values with a count above zero are listed. Letter counts ignore the `letter` filter. Unapproved
        pieces, and terms that are unapproved or under an unapproved ancestor, are never matched or counted.
        Credentials are ignored.
      operationId: listPieces
      security: []
      parameters:
        - name: term
          in: query
          required: false
          description: |
            Slugs of public piece terms (any facet but `affiliation`) to filter on; repeat the parameter for
            several. A slug given more than once counts once.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 20
            examples:
              - [war, swords]
            items:
              type: string
              pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
              maxLength: 191
              examples:
                - war
        - name: kind
          in: query
          required: false
          description: Kinds to filter on, matching a piece's primary or secondary kinds; repeat for several.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 6
            uniqueItems: true
            items:
              $ref: "#/components/schemas/PieceKind"
        - name: conservation_status
          in: query
          required: false
          description: Conservation statuses to filter on; repeat for several.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 5
            uniqueItems: true
            items:
              $ref: "#/components/schemas/ConservationStatus"
        - name: stub
          in: query
          required: false
          description: Only list pieces that are (`true`) or are not (`false`) stubs.
          schema:
            type: boolean
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Letter"
        - name: sort
          in: query
          required: false
          description: |
            The order: by sort title, or by `relevance` to `q` (best first, then by sort title). Defaults to
            `relevance` with `q` and `title` without; `relevance` needs `q`. Ties are broken by an internal ID, so
            pages are stable.
          schema:
            $ref: "#/components/schemas/PieceSort"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: The page of pieces, with the counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PieceList"
        "400":
          description: |
            A parameter is invalid: a `term` that is not a slug, more than 20 `term`s, or a slug that no public
            piece term has (the same `unknown term` error whether the term does not exist, is not approved, or is
            an affiliation); a `kind` or `conservation_status` that is not one of its values or is repeated; a
            `stub` that is not `true` or `false`; a `q` that is blank, longer than 200 characters or not valid
            UTF-8; a `letter` that is not A to Z or 0; `sort=relevance` without `q`; `limit` or `offset` out of
            range; a scalar parameter given more than once; or a query string that is not validly
            percent-encoded. The error code is `invalid_request`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                unknownTerm:
                  summary: No public piece term has the slug
                  value:
                    code: invalid_request
                    message: "unknown term: swords"
                invalidKind:
                  summary: A kind that is not a piece kind
                  value:
                    code: invalid_request
                    message: "invalid kind: not one of its allowed values"
        "500":
          $ref: "#/components/responses/InternalSearch"

  /v1/pieces/{slug}:
    get:
      tags:
        - Catalogue
      summary: Get a piece
      description: |
        Returns a public piece with everything its page shows: classification, credits, relations, links with
        their recorded performances, and conservation history. References to entities that are not public are
        left out: unapproved terms, collections and events, and credits to and performers who are unapproved or
        prefer not to have a page. Hidden links never appear. An unapproved piece is not found, exactly like an
        unknown one. Credentials are ignored.
      operationId: getPiece
      security: []
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: The piece.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Piece"
        "400":
          $ref: "#/components/responses/InvalidSlug"
        "404":
          description: No public piece has this slug; the error code is `not_found`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: not_found
                message: piece not found
        "500":
          $ref: "#/components/responses/Internal"

  /v1/persons:
    get:
      tags:
        - Catalogue
      summary: Search persons
      description: |
        Searches the public persons, returning one page of them with how many match in all and how many sort
        under each letter, ignoring the `letter` filter. Every filter given must match. Persons who prefer not to
        have a page are listed as stubs: `q` matches them by name only, and they match no `role` or
        `affiliation` filter. Hidden aliases never match. Unapproved persons are never listed or counted.
        Credentials are ignored.
      operationId: listPersons
      security: []
      parameters:
        - name: kind
          in: query
          required: false
          description: Kinds to filter on; repeat for several.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 3
            uniqueItems: true
            items:
              $ref: "#/components/schemas/PersonKind"
        - name: role
          in: query
          required: false
          description: Roles to filter on, matching a person with any of them; repeat for several.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 8
            uniqueItems: true
            items:
              $ref: "#/components/schemas/PersonRole"
        - name: affiliation
          in: query
          required: false
          description: |
            The slug of a public affiliation term, matching persons affiliated with it or any of its
            descendants.
          schema:
            type: string
            pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
            maxLength: 191
            examples:
              - northmarch
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Letter"
        - name: sort
          in: query
          required: false
          description: |
            The order: by sort name, or by `relevance` to `q` (best first, then by sort name). Defaults to
            `relevance` with `q` and `name` without; `relevance` needs `q`. Ties are broken by an internal ID, so
            pages are stable.
          schema:
            $ref: "#/components/schemas/PersonSort"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: The page of persons, with the counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonList"
        "400":
          description: |
            A parameter is invalid: a `kind` or `role` that is not one of its values or is repeated; an
            `affiliation` that is not a slug, or that no public affiliation term has (the same `unknown
            affiliation` error whether the term does not exist, is not approved, or is not an affiliation); a `q`
            that is blank, longer than 200 characters or not valid UTF-8; a `letter` that is not A to Z or 0;
            `sort=relevance` without `q`; `limit` or `offset` out of range; a scalar parameter given more than
            once; or a query string that is not validly percent-encoded. The error code is `invalid_request`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: invalid_request
                message: "unknown affiliation: northmarch"
        "500":
          $ref: "#/components/responses/InternalSearch"

  /v1/persons/{slug}:
    get:
      tags:
        - Catalogue
      summary: Get a person
      description: |
        Returns a public person. A person who prefers not to have a page is shown by identity only: name, kind,
        status and its source, with `is_stub` true and `profile` null. Otherwise the profile has their public
        aliases (hidden aliases never appear), roles, affiliations, relations to other public persons, links,
        works and performances. Works and performances are capped at 200 each, with totals. An unapproved person
        is not found, exactly like an unknown one. Credentials are ignored.
      operationId: getPerson
      security: []
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: The person.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
              examples:
                profile:
                  summary: A person with a page
                  value:
                    slug: wren-of-the-vale
                    name: Wren of the Vale
                    kind: community_bard
                    is_stub: false
                    status: active
                    status_date: null
                    status_source_url: null
                    profile:
                      pronouns: she/her
                      notes_md: A bard of the northern marches.
                      licensing_status: known
                      licensing_notes_md: Happy for her songs to be sung anywhere.
                      aliases:
                        - name: Wren
                          kind: nickname
                      roles:
                        - singer
                        - songwriter
                      affiliations:
                        - slug: northmarch
                          facet: affiliation
                          display_name: Northmarch
                      relations: []
                      links: []
                      works:
                        - piece:
                            slug: the-copper-kettle
                            title: The Copper Kettle
                            kind: song
                            secondary_kinds: []
                            conservation_status: low_risk
                            is_stub: false
                          role: lyrics
                          certainty: certain
                          part: null
                      works_total: 1
                      performances: []
                      performances_total: 0
                noPage:
                  summary: A person who prefers not to have a page
                  value:
                    slug: hollis-fenn
                    name: Hollis Fenn
                    kind: community_bard
                    is_stub: true
                    status: prefers_no_page
                    status_date: "2026-03-01"
                    status_source_url: https://example.org/requests/12
                    profile: null
        "400":
          $ref: "#/components/responses/InvalidSlug"
        "404":
          description: No public person has this slug; the error code is `not_found`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: not_found
                message: person not found
        "500":
          $ref: "#/components/responses/Internal"

  /v1/terms:
    get:
      tags:
        - Catalogue
      summary: List terms
      description: |
        Lists the public terms of one facet, or of every facet, in tree order: by facet in the order of the
        `Facet` enum, each parent before its children, and siblings by position, then display name. A term
        that is unapproved, or under an unapproved ancestor, is not listed, nor is its subtree. Each term's counts
        are of the distinct public pieces, and public persons with a page, that it or any public descendant
        classifies. Credentials are ignored.
      operationId: listTerms
      security: []
      parameters:
        - name: facet
          in: query
          required: false
          description: Only list terms of this facet. Omitted, terms of every facet are listed.
          schema:
            $ref: "#/components/schemas/Facet"
      responses:
        "200":
          description: The terms.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TermList"
        "400":
          description: |
            The `facet` is not a facet or is given more than once, or the query string is not validly
            percent-encoded; the error code is `invalid_request`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: invalid_request
                message: "invalid facet: not one of its allowed values"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/terms/{slug}:
    get:
      tags:
        - Catalogue
      summary: Get a term
      description: |
        Returns a public term with its aliases, ancestors, public children and related affiliation, and one page
        of its members: the public pieces it or any public descendant classifies, or for an `affiliation` term,
        the public persons with a page affiliated with it or any public descendant. The other member list is
        empty. Members are ordered by sort title or sort name; `piece_count` and `person_count` are their totals.
        A term that is unapproved, or under an unapproved ancestor, is not found, exactly like an unknown one.
        Credentials are ignored.
      operationId: getTerm
      security: []
      parameters:
        - $ref: "#/components/parameters/Slug"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: The term.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Term"
        "400":
          description: |
            The slug is not a valid slug, `limit` or `offset` is out of range or given more than once, or the
            query string is not validly percent-encoded; the error code is `invalid_request`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalidSlug:
                  summary: The slug is not a valid slug
                  value:
                    code: invalid_request
                    message: "invalid slug: must be lowercase ASCII letters and digits, in runs joined by single hyphens, at most 191 characters"
                invalidLimit:
                  summary: The limit is out of range
                  value:
                    code: invalid_request
                    message: "invalid limit: must be an integer from 1 to 100"
        "404":
          description: No public term has this slug; the error code is `not_found`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: not_found
                message: term not found
        "500":
          $ref: "#/components/responses/Internal"

  /v1/collections:
    get:
      tags:
        - Catalogue
      summary: List collections
      description: |
        Lists one page of the public collections, by sort name, with how many match in all and how many sort
        under each letter, ignoring the `letter` filter. Unapproved collections are not listed or counted.
        Credentials are ignored.
      operationId: listCollections
      security: []
      parameters:
        - name: kind
          in: query
          required: false
          description: Collection kinds to filter on; repeat for several.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 13
            uniqueItems: true
            items:
              $ref: "#/components/schemas/CollectionKind"
        - $ref: "#/components/parameters/Letter"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: The page of collections, with the counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionList"
        "400":
          description: |
            A `kind` is not a collection kind or is repeated, the `letter` is not A to Z or 0, `limit` or
            `offset` is out of range, a scalar parameter is given more than once, or the query string is not
            validly percent-encoded; the error code is `invalid_request`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: invalid_request
                message: "invalid kind: not one of its allowed values"
        "500":
          $ref: "#/components/responses/InternalSearch"

  /v1/collections/{collection_id}:
    get:
      tags:
        - Catalogue
      summary: Get a collection
      description: |
        Returns a public collection with its public region, parent and children, and its citations: each
        visible link in the collection, once for each public piece, or public person with a page, it is attached
        to, with the roles it is attached with. Citations are ordered by the piece's sort title or the person's
        sort name and capped at 200, with a total. Hidden links never appear. An unapproved collection is not
        found, exactly like an unknown one. Credentials are ignored.
      operationId: getCollection
      security: []
      parameters:
        - $ref: "#/components/parameters/CollectionID"
      responses:
        "200":
          description: The collection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"
        "400":
          description: |
            The `collection_id` is not a positive integer in decimal digits; the error code is `invalid_request`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: invalid_request
                message: "invalid collection_id: must be an integer from 1 to 9223372036854775807"
        "404":
          description: No public collection has this ID; the error code is `not_found`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: not_found
                message: collection not found
        "500":
          $ref: "#/components/responses/Internal"

  /v1/events:
    get:
      tags:
        - Catalogue
      summary: List events
      description: |
        Lists one page of the public events and venues, by name, with how many there are in all. Unapproved
        events are not listed. Credentials are ignored.
      operationId: listEvents
      security: []
      parameters:
        - name: kind
          in: query
          required: false
          description: Only list events of this kind. Omitted, both kinds are listed.
          schema:
            $ref: "#/components/schemas/EventKind"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: The page of events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventList"
        "400":
          description: |
            The `kind` is not an event kind, `limit` or `offset` is out of range, a parameter is given more than
            once, or the query string is not validly percent-encoded; the error code is `invalid_request`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: invalid_request
                message: "invalid offset: must be an integer from 0 to 10000"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/events/{slug}:
    get:
      tags:
        - Catalogue
      summary: Get an event
      description: |
        Returns a public event or venue with the performances recorded at it, newest year first (unknown years
        last), capped at 200, with a total. Performances on hidden links, of unapproved pieces, or recorded only
        by links of entities that are unapproved or prefer not to have a page are left out, as are performers who
        are unapproved or prefer not to have a page. An unapproved event is not found, exactly like an unknown
        one. Credentials are ignored.
      operationId: getEvent
      security: []
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: The event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          $ref: "#/components/responses/InvalidSlug"
        "404":
          description: No public event has this slug; the error code is `not_found`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: not_found
                message: event not found
        "500":
          $ref: "#/components/responses/Internal"

  /v1/pieces/{slug}/history:
