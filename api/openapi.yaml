            - $ref: "#/components/schemas/CollectionSummary"
            - type: "null"
        is_bardic_resource:
          $ref: "#/components/schemas/CollectionSummary/properties/is_bardic_resource"
        enumerable:
          $ref: "#/components/schemas/CollectionEnumerable"
      examples:
        - name: The Northmarch Songbook
