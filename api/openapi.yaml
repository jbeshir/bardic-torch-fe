        licensing_status:
          $ref: "#/components/schemas/LicensingStatus"
        licensing_notes_md:
          $ref: "#/components/schemas/EditorText"
        is_stub:
          type: boolean
        aliases:
          type: array
          items:
            type: object
            description: Another name of the person.
            additionalProperties: false
            required: [name, kind]
            properties:
              name:
                type: string
                examples:
                  - Morwen of the Vale
              kind:
                $ref: "#/components/schemas/PersonAliasKind"
        roles:
          type: array
          items:
            $ref: "#/components/schemas/PersonRole"
        affiliation_slugs:
          type: array
          description: The person's affiliation terms, by slug.
          items:
            $ref: "#/components/schemas/EditorSlug"
        relations:
          type: array
          items:
            type: object
            description: A relation of the person to another person.
            additionalProperties: false
            required: [to_person_slug, type]
            properties:
              to_person_slug:
                $ref: "#/components/schemas/EditorSlug"
              type:
                $ref: "#/components/schemas/PersonRelationType"
        links:
          type: array
          items:
            $ref: "#/components/schemas/EditorPersonLink"
      examples:
        - schema_version: 1
          name: Morwen
          kind: community_bard
          status: active
          status_date: null
          status_source_url: null
          pronouns: null
          notes_md: null
          licensing_status: unknown
          licensing_notes_md: null
          is_stub: true
          aliases: []
          roles: []
          affiliation_slugs: []
          relations: []
          links: []

    EditorTermDocument:
      type: object
      description: A term's document in the editor format, with its parent and related affiliation by slug.
      additionalProperties: false
      required: [schema_version, facet, name, display_name, parent_slug, related_affiliation_slug, description_md,
        position, aliases]
      properties:
        schema_version:
          $ref: "#/components/schemas/SchemaVersion"
        facet:
          $ref: "#/components/schemas/Facet"
        name:
          type: string
          examples:
            - Drinking songs
        display_name:
          type: string
          examples:
            - Drinking songs
        parent_slug:
          oneOf:
            - $ref: "#/components/schemas/EditorSlug"
            - type: "null"
        related_affiliation_slug:
          oneOf:
            - $ref: "#/components/schemas/EditorSlug"
            - type: "null"
        description_md:
          $ref: "#/components/schemas/EditorText"
        position:
          type: integer
          examples:
            - 0
        aliases:
          type: array
          items:
            type: string
            examples:
              - Tavern songs
      examples:
        - schema_version: 1
          facet: topic
          name: Drinking songs
          display_name: Drinking songs
          parent_slug: null
          related_affiliation_slug: null
          description_md: null
          position: 0
          aliases: []

    EditorCollectionDocument:
      type: object
      description: A collection's document in the editor format, with its region by slug and its parent by ID.
      additionalProperties: false
      required: [schema_version, name, url, kind, description_md, region_term_slug, parent_id, is_bardic_resource,
        enumerable]
      properties:
        schema_version:
          $ref: "#/components/schemas/SchemaVersion"
        name:
          type: string
          examples:
            - The Northmarch Songbook
        url:
          type: [string, "null"]
          examples:
            - https://example.org/songbook.pdf
        kind:
          $ref: "#/components/schemas/CollectionKind"
        description_md:
          $ref: "#/components/schemas/EditorText"
        region_term_slug:
          oneOf:
            - $ref: "#/components/schemas/EditorSlug"
            - type: "null"
        parent_id:
          type: [integer, "null"]
          format: int64
          minimum: 1
          description: The collection this one is part of, by its `id`.
          examples:
            - 3
        is_bardic_resource:
          type: boolean
        enumerable:
          $ref: "#/components/schemas/CollectionEnumerable"
      examples:
        - schema_version: 1
          name: The Northmarch Songbook
          url: https://example.org/songbook.pdf
          kind: songbook_pdf
          description_md: null
          region_term_slug: null
          parent_id: null
          is_bardic_resource: true
          enumerable: pdf

    EditorEventDocument:
      type: object
      description: An event's or venue's document in the editor format.
      additionalProperties: false
      required: [schema_version, name, kind, description_md]
      properties:
        schema_version:
          $ref: "#/components/schemas/SchemaVersion"
        name:
          type: string
          examples:
            - Midwinter Revel
        kind:
          $ref: "#/components/schemas/EventKind"
        description_md:
          $ref: "#/components/schemas/EditorText"
      examples:
        - schema_version: 1
          name: Midwinter Revel
          kind: event
          description_md: null

    EditorDocument:
      description: A document in the editor format, in the shape of the `entity_type` beside it.
      oneOf:
        - $ref: "#/components/schemas/EditorPieceDocument"
        - $ref: "#/components/schemas/EditorPersonDocument"
        - $ref: "#/components/schemas/EditorTermDocument"
        - $ref: "#/components/schemas/EditorCollectionDocument"
        - $ref: "#/components/schemas/EditorEventDocument"
      examples:
        - schema_version: 1
          name: Midwinter Revel
          kind: event
          description_md: null

    Editable:
      type: object
      description: |
        An entity's editable document: the caller's own pending revision of it (`pending_revision_id`) if they have
        one, and otherwise its current revision. Submit the edit on `base_revision_id`.
      additionalProperties: false
      required: [entity_type, base_revision_id, pending_revision_id, document]
      properties:
        entity_type:
          $ref: "#/components/schemas/EntityType"
        base_revision_id:
          type: integer
          format: int64
          minimum: 1
          description: The approved revision to submit the edit on.
          examples:
            - 46
        pending_revision_id:
          type: [integer, "null"]
          format: int64
          minimum: 1
          description: The caller's own pending revision the document is, or null.
          examples:
            - null
        document:
          $ref: "#/components/schemas/EditorDocument"
      examples:
        - entity_type: event
          base_revision_id: 46
          pending_revision_id: null
          document:
            schema_version: 1
            name: Midwinter Revel
            kind: event
            description_md: null

    SubmitRevisionRequest:
      type: object
      description: |
        A revision: an edit of the entity whose approved revision `base_revision_id` is, or with it null a new
        entity of `entity_type`.
      additionalProperties: false
      required: [entity_type, base_revision_id, summary, document, acknowledge_duplicates, acknowledge_stale]
      properties:
        entity_type:
          $ref: "#/components/schemas/EntityType"
        base_revision_id:
          type: [integer, "null"]
          format: int64
          minimum: 1
          examples:
            - 46
        summary:
          type: string
          description: |
            What the edit changes, at most 500 characters; may be empty. When the edit changes a piece's
            conservation status, the summary is the reason in its conservation history.
          examples:
            - Describe the revel.
        document:
          $ref: "#/components/schemas/EditorDocument"
        acknowledge_duplicates:
          type: boolean
          description: Submit a new entity that may duplicate public ones.
        acknowledge_stale:
          type: boolean
          description: For a moderator, approve the edit even if the entity has changed since its base.
      examples:
        - entity_type: event
          base_revision_id: 46
          summary: Describe the revel.
          document:
            schema_version: 1
            name: Midwinter Revel
            kind: event
            description_md: Held every year at the turning of the year.
          acknowledge_duplicates: false
          acknowledge_stale: false

    ApproveRevisionRequest:
      type: object
      description: An approval.
      additionalProperties: false
      required: [acknowledge_stale]
      properties:
        acknowledge_stale:
          type: boolean
          description: Approve the revision even if it is stale, overwriting the changes since its base.
      examples:
        - acknowledge_stale: false

    RejectRevisionRequest:
      type: object
      description: A rejection, with a note to the author.
      additionalProperties: false
      required: [note]
      properties:
        note:
          type: string
          description: Why the revision is rejected; required, at most 2000 characters, trimmed.
          minLength: 1
          examples:
            - Please redo this on the current version.
      examples:
        - note: Please redo this on the current version.

    ModerationAuthor:
      type: object
      description: A revision's author as moderators see them, with their user ID.
      additionalProperties: false
      required: [user_id, display_name]
      properties:
        user_id:
          $ref: "#/components/schemas/User/properties/id"
        display_name:
          $ref: "#/components/schemas/User/properties/display_name"
      examples:
        - user_id: google-oauth2|456
          display_name: Morwen

    RevisionListItem:
      type: object
      description: |
        A revision as the caller's own list and the moderation queue show it. `entity` is null for a new entity's
        revision that is not approved; `review_note` is a moderator's note on rejecting it; `is_stale` is true when
        its entity has changed since its base.
      additionalProperties: false
      required: [id, entity_type, entity, status, summary, created_at, review_note, reviewed_at, is_stale, author]
      properties:
        id:
          $ref: "#/components/schemas/RevisionSummary/properties/id"
        entity_type:
          $ref: "#/components/schemas/EntityType"
        entity:
          oneOf:
            - type: object
              description: The entity, by `slug` (a collection by `collection_id`), with its title or name.
              additionalProperties: false
              required: [slug, collection_id, name]
              properties:
                slug:
                  $ref: "#/components/schemas/DuplicateMatch/properties/slug"
                collection_id:
                  $ref: "#/components/schemas/DuplicateMatch/properties/collection_id"
                name:
                  $ref: "#/components/schemas/DuplicateMatch/properties/name"
            - type: "null"
        status:
          $ref: "#/components/schemas/RevisionStatus"
        summary:
          $ref: "#/components/schemas/RevisionSummary/properties/summary"
        created_at:
          $ref: "#/components/schemas/RevisionSummary/properties/created_at"
        review_note:
          $ref: "#/components/schemas/RevisionView/properties/review_note"
        reviewed_at:
          type: [string, "null"]
          format: date-time
          description: When a moderator approved or rejected the revision.
          examples:
            - null
        is_stale:
          type: boolean
        author:
          description: The revision's author, in the moderation queue; null in the caller's own list.
          oneOf:
            - $ref: "#/components/schemas/ModerationAuthor"
            - type: "null"
      examples:
        - id: 51
          entity_type: event
          entity:
            slug: midwinter-revel
            collection_id: null
            name: Midwinter Revel
          status: pending
          summary: Describe the revel.
          created_at: "2026-10-01T09:00:00Z"
          review_note: null
          reviewed_at: null
          is_stale: false
          author: null

    RevisionList:
      type: object
      description: One page of revisions, with how many there are in all.
      additionalProperties: false
      required: [data, total]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/RevisionListItem"
        total:
          type: integer
          format: int64
          minimum: 0
          examples:
            - 1
      examples:
        - data: []
          total: 0

    Snapshot:
      description: A snapshot view, in the shape of the `entity_type` beside it.
      oneOf:
        - $ref: "#/components/schemas/PieceSnapshot"
        - $ref: "#/components/schemas/PersonSnapshot"
        - $ref: "#/components/schemas/TermSnapshot"
        - $ref: "#/components/schemas/CollectionSnapshot"
        - $ref: "#/components/schemas/EventSnapshot"
      examples:
        - name: Midwinter Revel
          kind: event
          description_md: null

    RevisionView:
      type: object
      description: |
        A revision of any status as its author sees it, with the same snapshot views as a public revision
        (`GET /v1/revisions/{revision_id}`). `entity` is null for a new entity's revision that is not approved;
        `review_note` is a moderator's note on rejecting it.
      additionalProperties: false
      required: [entity_type, id, source, summary, author, contributors, created_at, status, review_note,
        reviewed_at, entity, base_revision_id, snapshot, base_snapshot, changed_fields]
      properties:
        entity_type:
          $ref: "#/components/schemas/EntityType"
        id:
          $ref: "#/components/schemas/RevisionSummary/properties/id"
        source:
          $ref: "#/components/schemas/RevisionSource"
        summary:
          $ref: "#/components/schemas/RevisionSummary/properties/summary"
        author:
          $ref: "#/components/schemas/RevisionSummary/properties/author"
        contributors:
          $ref: "#/components/schemas/RevisionSummary/properties/contributors"
        created_at:
          $ref: "#/components/schemas/RevisionSummary/properties/created_at"
        status:
          $ref: "#/components/schemas/RevisionStatus"
        review_note:
          type: [string, "null"]
          examples:
            - Please cite the source of the credit.
        reviewed_at:
          $ref: "#/components/schemas/RevisionListItem/properties/reviewed_at"
        entity:
          description: The entity as it is now, in the shape of `entity_type`, or null.
          oneOf:
            - $ref: "#/components/schemas/PieceSummary"
            - $ref: "#/components/schemas/PersonSummary"
            - $ref: "#/components/schemas/TermSummary"
            - $ref: "#/components/schemas/CollectionRef"
            - $ref: "#/components/schemas/EventSummary"
            - type: "null"
        base_revision_id:
          $ref: "#/components/schemas/PieceRevision/properties/base_revision_id"
        snapshot:
          $ref: "#/components/schemas/Snapshot"
        base_snapshot:
          oneOf:
            - $ref: "#/components/schemas/Snapshot"
            - type: "null"
        changed_fields:
          type: array
          description: The snapshot's top-level fields that differ from the base's or, with no base, are not empty.
          uniqueItems: true
          items:
            type: string
            examples:
              - description_md
      examples:
        - entity_type: event
          id: 51
          source: user
          summary: Describe the revel.
          author: {display_name: Morwen}
          contributors: []
          created_at: "2026-10-01T09:00:00Z"
          status: rejected
          review_note: Please cite the source.
          reviewed_at: "2026-10-02T09:00:00Z"
          entity: {slug: midwinter-revel, name: Midwinter Revel, kind: event}
          base_revision_id: 46
          snapshot: {name: Midwinter Revel, kind: event, description_md: Held at midwinter.}
          base_snapshot: {name: Midwinter Revel, kind: event, description_md: null}
          changed_fields: [description_md]

    ModerationRevisionView:
      type: object
      description: |
        A revision as a moderator sees it: the author's view, with the author's user ID (null for an import); for a
        stale revision the entity's current revision and the snapshot's fields that differ from it (otherwise
        null); and for a new entity's pending revision the public entities it may duplicate.
      additionalProperties: false
      required: [entity_type, id, source, summary, author, contributors, created_at, status, review_note,
        reviewed_at, entity, base_revision_id, snapshot, base_snapshot, changed_fields, author_user_id,
        current_revision_id, current_snapshot, changed_fields_since_current, possible_duplicates]
      properties:
        entity_type:
          $ref: "#/components/schemas/EntityType"
        id:
          $ref: "#/components/schemas/RevisionSummary/properties/id"
        source:
          $ref: "#/components/schemas/RevisionSource"
        summary:
          $ref: "#/components/schemas/RevisionSummary/properties/summary"
        author:
          $ref: "#/components/schemas/RevisionSummary/properties/author"
        contributors:
          $ref: "#/components/schemas/RevisionSummary/properties/contributors"
        created_at:
          $ref: "#/components/schemas/RevisionSummary/properties/created_at"
        status:
          $ref: "#/components/schemas/RevisionStatus"
        review_note:
          $ref: "#/components/schemas/RevisionView/properties/review_note"
        reviewed_at:
          $ref: "#/components/schemas/RevisionListItem/properties/reviewed_at"
        entity:
          $ref: "#/components/schemas/RevisionView/properties/entity"
        base_revision_id:
          $ref: "#/components/schemas/PieceRevision/properties/base_revision_id"
        snapshot:
          $ref: "#/components/schemas/Snapshot"
        base_snapshot:
          $ref: "#/components/schemas/RevisionView/properties/base_snapshot"
        changed_fields:
          $ref: "#/components/schemas/RevisionView/properties/changed_fields"
        author_user_id:
          type: [string, "null"]
          examples:
            - google-oauth2|456
        current_revision_id:
          type: [integer, "null"]
          format: int64
          minimum: 1
          examples:
            - 52
        current_snapshot:
          $ref: "#/components/schemas/RevisionView/properties/base_snapshot"
        changed_fields_since_current:
          type: [array, "null"]
          uniqueItems: true
          items:
            type: string
            examples:
              - name
        possible_duplicates:
          type: array
          items:
            $ref: "#/components/schemas/DuplicateMatch"
      examples:
        - entity_type: event
          id: 51
          source: user
          summary: Describe the revel.
          author: {display_name: Morwen}
          contributors: []
          created_at: "2026-10-01T09:00:00Z"
          status: pending
          review_note: null
          reviewed_at: null
          entity: {slug: midwinter-revel, name: Midwinter Revel, kind: event}
          base_revision_id: 46
          snapshot: {name: Midwinter Revel, kind: event, description_md: Held at midwinter.}
          base_snapshot: {name: Midwinter Revel, kind: event, description_md: null}
          changed_fields: [description_md]
          author_user_id: google-oauth2|456
          current_revision_id: null
          current_snapshot: null
          changed_fields_since_current: null
          possible_duplicates: []
