    EditorSlug:
      type: string
      description: The slug of a public piece, person, term or event the document references.
      examples:
        - the-copper-kettle

    EditorText:
      type: [string, "null"]
      description: Markdown or plain text.
      examples:
        - Sung at every revel since the founding of the barony.

    SchemaVersion:
      type: integer
      description: The document's schema version; send back the version the editable document gave.
      minimum: 1
      maximum: 1
      examples:
        - 1

    EditorPerformance:
      type: object
      description: A performance a link records, with its event and performers by slug.
      additionalProperties: false
      required: [event_slug, year, uploader, description_verbatim, performer_slugs]
      properties:
