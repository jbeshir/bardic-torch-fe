          $ref: "#/components/schemas/RelationDirection"
        person:
          $ref: "#/components/schemas/PersonSummary"
      examples:
        - type: member_of
          direction: outgoing
          person:
            slug: northmarch-bards
            name: Northmarch Bards
            kind: group
            is_stub: false

    PersonWork:
      type: object
      description: A person's credit on a public piece. Its attribution is always named.
      additionalProperties: false
      required: [piece, role, certainty, part]
      properties:
        piece:
          $ref: "#/components/schemas/PieceSummary"
        role:
          $ref: "#/components/schemas/CreditRole"
        certainty:
          $ref: "#/components/schemas/Certainty"
        part:
          $ref: "#/components/schemas/PieceCredit/properties/part"
      examples:
        - piece:
            slug: the-copper-kettle
            title: The Copper Kettle
            kind: song
            secondary_kinds: []
            conservation_status: endangered
            is_stub: false
            credit_names: []
          role: lyrics
          certainty: certain
          part: null

    PersonPerformance:
      type: object
      description: A performance on a person's page.
      additionalProperties: false
      required: [piece, link, year, event, description_verbatim]
      properties:
        piece:
          description: The public piece performed, or null for a performance of no particular piece.
          oneOf:
            - $ref: "#/components/schemas/PieceSummary"
            - type: "null"
        link:
          $ref: "#/components/schemas/PerformanceLink"
        year:
          $ref: "#/components/schemas/PiecePerformance/properties/year"
        event:
          $ref: "#/components/schemas/PiecePerformance/properties/event"
        description_verbatim:
          $ref: "#/components/schemas/PiecePerformance/properties/description_verbatim"
      examples:
        - piece: null
          link:
            url: https://video.example.org/watch/revel
            title: Midwinter Revel 2025
            platform: video.example.org
          year: 2025
          event: null
          description_verbatim: Wren opens the evening

    PerformanceLink:
      type: object
      description: The link recording a performance.
      additionalProperties: false
      required: [url, title, platform]
      properties:
        url:
          $ref: "#/components/schemas/PersonLink/properties/url"
        title:
          $ref: "#/components/schemas/PersonLink/properties/title"
        platform:
          $ref: "#/components/schemas/PersonLink/properties/platform"
      examples:
        - url: https://video.example.org/watch/revel
          title: Midwinter Revel 2025
          platform: video.example.org

    TermList:
      type: object
      description: The public terms, in tree order.
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/TermListItem"
      examples:
        - data:
            - slug: war
              facet: topic
              name: War
              display_name: War
              parent_slug: null
              piece_count: 12
              person_count: 0
            - slug: swords
              facet: topic
              name: Swords
              display_name: Swords
              parent_slug: war
              piece_count: 4
              person_count: 0

    TermListItem:
      type: object
      description: A public term in the list of terms, with its counts.
      additionalProperties: false
      required: [slug, facet, name, display_name, parent_slug, piece_count, person_count]
      properties:
        slug:
          $ref: "#/components/schemas/TermSummary/properties/slug"
        facet:
          $ref: "#/components/schemas/Facet"
        name:
          type: string
          description: The term's full name, including any disambiguation suffix.
          examples:
            - 16th Century (Origin)
        display_name:
          $ref: "#/components/schemas/TermSummary/properties/display_name"
        parent_slug:
          type: [string, "null"]
          description: The slug of the term's parent, or null for a root term.
          examples:
            - war
        piece_count:
          type: integer
          format: int64
          minimum: 0
          description: |
            How many distinct public pieces the term or any public descendant classifies.
          examples:
            - 4
        person_count:
          type: integer
          format: int64
          minimum: 0
          description: |
            How many distinct public persons with a page are affiliated with the term or any public descendant.
          examples:
            - 0
      examples:
        - slug: swords
          facet: topic
          name: Swords
          display_name: Swords
          parent_slug: war
          piece_count: 4
          person_count: 0

    Term:
      type: object
      description: A public term's page, with one page of its members.
      additionalProperties: false
      required:
        - slug
        - facet
        - name
        - display_name
        - description_md
        - aliases
        - ancestors
        - children
        - related_affiliation
        - piece_count
        - person_count
        - pieces
        - persons
        - updated_at
      properties:
        slug:
          $ref: "#/components/schemas/TermSummary/properties/slug"
        facet:
          $ref: "#/components/schemas/Facet"
        name:
          $ref: "#/components/schemas/TermListItem/properties/name"
        display_name:
          $ref: "#/components/schemas/TermSummary/properties/display_name"
        description_md:
          type: [string, "null"]
          description: What the term covers, in Markdown.
          examples:
            - Songs about war and warriors.
        aliases:
          type: array
          description: Other names of the term.
          items:
            type: string
            examples:
              - Battle
        ancestors:
          type: array
          description: The term's ancestors, root first.
          items:
            $ref: "#/components/schemas/TermSummary"
        children:
          type: array
          description: The term's public children, by position, then display name.
          items:
            $ref: "#/components/schemas/TermChild"
        related_affiliation:
          description: The public affiliation term this term implies, if any.
          oneOf:
            - $ref: "#/components/schemas/TermSummary"
            - type: "null"
        piece_count:
          $ref: "#/components/schemas/TermListItem/properties/piece_count"
        person_count:
          $ref: "#/components/schemas/TermListItem/properties/person_count"
        pieces:
          type: array
          description: |
            One page of the public pieces the term or any public descendant classifies, by sort title. Empty for
            an `affiliation` term.
          items:
            $ref: "#/components/schemas/PieceSummary"
        persons:
          type: array
          description: |
            One page of the public persons with a page affiliated with the term or any public descendant, by sort
            name. Empty unless the term is an `affiliation` term.
          items:
            $ref: "#/components/schemas/PersonSummary"
        updated_at:
          $ref: "#/components/schemas/Piece/properties/updated_at"
      examples:
        - slug: war
          updated_at: "2026-03-01T12:00:00Z"
          facet: topic
          name: War
          display_name: War
          description_md: null
          aliases: [Battle]
          ancestors: []
          children:
            - term:
                slug: swords
                facet: topic
                display_name: Swords
              piece_count: 4
              person_count: 0
          related_affiliation: null
          piece_count: 1
          person_count: 0
          pieces:
            - slug: the-copper-kettle
              title: The Copper Kettle
              kind: song
              secondary_kinds: []
              conservation_status: endangered
              is_stub: false
              credit_names: []
          persons: []

    TermChild:
      type: object
      description: A public child of a term, with its counts.
      additionalProperties: false
      required: [term, piece_count, person_count]
      properties:
        term:
          $ref: "#/components/schemas/TermSummary"
        piece_count:
          $ref: "#/components/schemas/TermListItem/properties/piece_count"
        person_count:
          $ref: "#/components/schemas/TermListItem/properties/person_count"
      examples:
        - term:
            slug: swords
            facet: topic
            display_name: Swords
          piece_count: 4
          person_count: 0

    CollectionSummary:
      type: object
      description: A public collection, as lists of collections show it.
      additionalProperties: false
      required: [id, name, kind, url, is_bardic_resource]
      properties:
        id:
          $ref: "#/components/schemas/CollectionRef/properties/id"
        name:
          $ref: "#/components/schemas/CollectionRef/properties/name"
        kind:
          $ref: "#/components/schemas/CollectionKind"
        url:
          type: [string, "null"]
          description: Where the collection is.
          examples:
            - https://example.org/songbook.pdf
        is_bardic_resource:
          type: boolean
          description: Whether the collection is a resource made for or by bards.
          examples:
            - true
      examples:
        - id: 12
          name: The Northmarch Songbook
          kind: songbook_pdf
          url: https://example.org/songbook.pdf
          is_bardic_resource: true

    Collection:
      type: object
      description: A public collection's page.
      additionalProperties: false
      required:
        - id
        - name
        - kind
        - url
        - is_bardic_resource
        - description_md
        - enumerable
        - region
        - parent
        - children
        - citations
        - citations_total
        - updated_at
      properties:
        id:
          $ref: "#/components/schemas/CollectionRef/properties/id"
        name:
          $ref: "#/components/schemas/CollectionRef/properties/name"
        kind:
          $ref: "#/components/schemas/CollectionKind"
        url:
          $ref: "#/components/schemas/CollectionSummary/properties/url"
        is_bardic_resource:
          $ref: "#/components/schemas/CollectionSummary/properties/is_bardic_resource"
        description_md:
          type: [string, "null"]
          description: What the collection holds, in Markdown.
          examples:
            - Songs of the northern marches.
        enumerable:
          $ref: "#/components/schemas/CollectionEnumerable"
        region:
          description: The public term for the region the collection is from, if any.
          oneOf:
            - $ref: "#/components/schemas/TermSummary"
            - type: "null"
        parent:
          description: The public collection this one is part of, if any.
          oneOf:
            - $ref: "#/components/schemas/CollectionSummary"
            - type: "null"
        children:
          type: array
          description: The public collections that are part of this one, by sort name.
          items:
            $ref: "#/components/schemas/CollectionSummary"
        citations:
          type: array
          description: |
            The collection's visible links, once for each public piece or public person each is attached to, by
            the piece's sort title or the person's sort name. At most 200.
          maxItems: 200
          items:
            $ref: "#/components/schemas/CollectionCitation"
        citations_total:
          type: integer
          format: int64
          minimum: 0
          description: How many citations the collection has in all.
          examples:
            - 1
        updated_at:
          $ref: "#/components/schemas/Piece/properties/updated_at"
      examples:
        - id: 12
          updated_at: "2026-03-01T12:00:00Z"
          name: The Northmarch Songbook
          kind: songbook_pdf
          url: https://example.org/songbook.pdf
          is_bardic_resource: true
          description_md: null
          enumerable: pdf
          region: null
          parent: null
          children: []
          citations:
            - piece:
                slug: the-copper-kettle
                title: The Copper Kettle
                kind: song
                secondary_kinds: []
                conservation_status: endangered
                is_stub: false
                credit_names: []
              person: null
              url: https://example.org/songbook.pdf
              title: The Northmarch Songbook
              locator: p. 12
              roles: [lyrics]
          citations_total: 1

    CollectionCitation:
      type: object
      description: |
        A link in a collection, attached to a piece or a person: exactly one of `piece` and `person` is set.
      additionalProperties: false
      required: [piece, person, url, title, locator, roles]
      properties:
        piece:
          description: The public piece the link is attached to, or null if it is attached to a person.
          oneOf:
            - $ref: "#/components/schemas/PieceSummary"
            - type: "null"
        person:
          description: The public person the link is attached to, or null if it is attached to a piece.
          oneOf:
            - $ref: "#/components/schemas/PersonSummary"
            - type: "null"
        url:
          $ref: "#/components/schemas/PersonLink/properties/url"
        title:
          $ref: "#/components/schemas/PersonLink/properties/title"
        locator:
          $ref: "#/components/schemas/PersonLink/properties/locator"
        roles:
          type: array
          description: The roles the link is attached to the piece or person with, in attachment order.
          items:
            $ref: "#/components/schemas/LinkRole"
      examples:
        - piece: null
          person:
            slug: wren-of-the-vale
            name: Wren of the Vale
            kind: community_bard
            is_stub: false
          url: https://example.org/songbook.pdf
          title: null
          locator: p. 3
          roles: [external_profile]

    EventList:
      type: object
      description: One page of the public events and venues, by name.
      additionalProperties: false
      required: [data, total]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/EventSummary"
        total:
          type: integer
          format: int64
          minimum: 0
          description: How many events match, over every page.
          examples:
            - 1
      examples:
        - data:
            - slug: midwinter-revel
              name: Midwinter Revel
              kind: event
          total: 1

    Event:
      type: object
      description: A public event's or venue's page.
      additionalProperties: false
      required: [slug, name, kind, description_md, performances, performances_total, updated_at]
      properties:
        slug:
          $ref: "#/components/schemas/EventSummary/properties/slug"
        name:
          $ref: "#/components/schemas/EventSummary/properties/name"
        kind:
          $ref: "#/components/schemas/EventKind"
        description_md:
          type: [string, "null"]
          description: About the event or venue, in Markdown.
          examples:
            - A winter gathering of the northern marches.
        performances:
          type: array
          description: The performances recorded at the event, newest year first, unknown years last. At most 200.
          maxItems: 200
          items:
            $ref: "#/components/schemas/EventPerformance"
        performances_total:
          type: integer
          format: int64
          minimum: 0
          description: How many performances the event has in all.
          examples:
            - 1
        updated_at:
          $ref: "#/components/schemas/Piece/properties/updated_at"
      examples:
        - slug: midwinter-revel
          updated_at: "2026-03-01T12:00:00Z"
          name: Midwinter Revel
          kind: event
          description_md: null
          performances:
            - piece: null
              link:
                url: https://video.example.org/watch/revel
                title: Midwinter Revel 2025
                platform: video.example.org
              year: 2025
              performers: []
              description_verbatim: Wren opens the evening
          performances_total: 1

    EventPerformance:
      type: object
      description: |
        A performance on an event's page. Performers who are not public are left out.
      additionalProperties: false
      required: [piece, link, year, performers, description_verbatim]
      properties:
        piece:
          $ref: "#/components/schemas/PersonPerformance/properties/piece"
        link:
          $ref: "#/components/schemas/PerformanceLink"
        year:
          $ref: "#/components/schemas/PiecePerformance/properties/year"
        performers:
          $ref: "#/components/schemas/PiecePerformance/properties/performers"
        description_verbatim:
          $ref: "#/components/schemas/PiecePerformance/properties/description_verbatim"
      examples:
        - piece: null
          link:
            url: https://video.example.org/watch/revel
            title: Midwinter Revel 2025
            platform: video.example.org
          year: 2025
          performers:
            - slug: wren-of-the-vale
              name: Wren of the Vale
              kind: community_bard
              is_stub: false
          description_verbatim: Wren opens the evening

    PieceKind:
      type: string
      description: What sort of piece a piece is.
      enum: [song, poem, story, dance_music, instrumental, comedy]
      examples:
        - song

    ConservationStatus:
      type: string
      description: |
        How at risk a piece is of being lost. `restricted` overrides every other status and means the piece
        should not be spread further.
      enum: [unassessed, low_risk, endangered, critically_endangered, restricted]
      examples:
        - endangered

    PersonKind:
      type: string
      description: What sort of person a person is.
      enum: [community_bard, historical, group]
      examples:
        - community_bard

    PersonStatus:
      type: string
      description: |
        A person's status. A person who `prefers_no_page` has a page showing their identity only, and is
        named without a link elsewhere.
      enum: [active, deceased, prefers_no_page]
      examples:
        - active

    Facet:
      type: string
      description: |
        The dimension a term classifies along. `affiliation` terms classify persons; the others classify pieces.
      enum: [mood, topic, culture, language, legendaria, form, origin, other, affiliation]
      examples:
        - topic

    EventKind:
      type: string
      description: Whether an event is a venue or a one-off event.
      enum: [venue, event]
      examples:
        - event

    LicensingStatus:
      type: string
      description: Whether the licensing is known.
      enum: [known, unknown]
      examples:
        - known

    Licence:
      type: string
      description: |
        The licence a piece is published under: public domain, a Creative Commons licence, all rights reserved
        or another licence.
      enum: [pd, cc_by, cc_by_sa, cc_by_nc, cc_by_nc_sa, cc_by_nd, cc_by_nc_nd, arr, other]
      examples:
        - cc_by_sa

    LicenceVersion:
      type: string
      description: The version of a Creative Commons licence. It is shown only beside a `cc_*` licence.
      enum: ["1.0", "2.0", "2.5", "3.0", "4.0"]
      examples:
        - "4.0"

    PieceAliasKind:
      type: string
      description: What sort of alternative title an alias is.
      enum: [alt_title, nickname, subtitle, redirect]
      examples:
        - alt_title

    PersonAliasKind:
      type: string
      description: What sort of name an alias is.
      enum: [legal, sca, stage, nickname, former, redirect]
      examples:
        - stage

    PiecePart:
      type: string
      description: The part of a piece a term or credit applies to.
      enum: [words, tune, verses, chorus]
      examples:
        - tune

    CreditRole:
      type: string
      description: What a credit credits.
      enum: [lyrics, tune, author, choreography, music, arrangement, translation]
      examples:
        - lyrics

    Attribution:
      type: string
      description: Who a credit is attributed to. Only a `named` credit has a person.
      enum: [named, traditional, unknown, anonymous, various]
      examples:
        - named

    Certainty:
      type: string
      description: How certain a credit is.
      enum: [certain, probable, possible, disputed]
      examples:
        - certain

    PieceRelationType:
      type: string
      description: How one piece relates to another, read from the relation's source to its target.
      enum: [variant_of, contrafactum_of, setting_of, same_text_other_form]
      examples:
        - variant_of

    PersonRelationType:
      type: string
      description: How one person relates to another, read from the relation's source to its target.
      enum: [heir_of, member_of, same_as]
      examples:
        - member_of

    RelationDirection:
      type: string
      description: |
        Which way a relation points: `outgoing` reads "this entity <type> the other", `incoming` reads "the other
        <type> this entity".
      enum: [outgoing, incoming]
      examples:
        - outgoing

    PersonRole:
      type: string
      description: Something a person does.
      enum: [singer, songwriter, musician, instrumentalist, storyteller, poet, jester, dancer]
      examples:
        - singer

    LinkPlaceType:
      type: string
      description: What sort of place a link points to.
      enum:
        - recording_platform
        - streaming
        - author_site
        - community_archive
        - physical_archive
        - book
        - vendor
        - author_contact
        - oral_tradition
        - other
      examples:
        - recording_platform

    Liveness:
      type: string
      description: |
        Whether a link worked when last checked: `unknown` if never checked, `blocked` if the site refused the
        checker.
      enum: [unknown, ok, dead, blocked]
      examples:
        - ok

    LinkRole:
      type: string
      description: What a link offers about the piece or person it is attached to.
      enum:
        - official
        - lyrics
        - text
        - sheet_music
        - dance_instructions
        - text_source
        - translation
        - performance
        - licensing_source
        - website
        - external_profile
        - other
      examples:
        - lyrics

    CollectionKind:
      type: string
      description: What sort of resource a collection is.
      enum:
        - index_or_link_list
        - songbook_pdf
        - songbook_website
        - website
        - wiki_category
        - wiki
        - youtube_channel
        - youtube_playlist
        - google_doc_songbook
        - blog
        - archived_songbook
        - hosted_document
        - other
      examples:
        - songbook_pdf

    CollectionEnumerable:
      type: string
      description: |
        Whether, and how, a collection's contents can be listed: `yes`, from a `pdf`, with a `browser`, through
        an `api`, `no`, or `unknown` if not yet assessed.
      enum: [unknown, "yes", pdf, browser, api, "no"]
      examples:
        - pdf

    RevisionSource:
      type: string
      description: |
        Where a revision came from: submitted by a `user` through the API, or an `import` from the old wiki.
      enum: [user, import]
      examples:
        - import

    RevisionAuthor:
      type: object
      description: The author of a revision, by display name; user IDs are never shown.
      additionalProperties: false
      required: [display_name]
      properties:
        display_name:
          type: string
          examples:
            - Morwen
      examples:
        - display_name: Morwen

    RevisionSummary:
      type: object
      description: A public revision, as an entity's history lists it.
      additionalProperties: false
      required: [id, source, summary, author, contributors, created_at]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          description: The revision's ID, its address.
          examples:
            - 42
        source:
          $ref: "#/components/schemas/RevisionSource"
        summary:
          type: string
          description: What the revision changed, in its author's words; may be empty.
          examples:
            - Credit the tune.
        author:
          description: Who wrote the revision, or null for one with no author, such as an import.
          oneOf:
            - $ref: "#/components/schemas/RevisionAuthor"
            - type: "null"
        contributors:
          type: array
          description: The wiki users who wrote an imported revision, in order; empty for other revisions.
          items:
            type: string
            examples:
              - Archivist
        created_at:
          type: string
          format: date-time
          description: When the revision was created.
          examples:
            - "2026-10-01T09:00:00Z"
      examples:
        - id: 42
          source: import
          summary: ""
          author: null
          contributors: [Archivist, Lorekeeper]
          created_at: "2026-01-01T00:00:00Z"

    RevisionHistory:
      type: object
      description: One page of a public entity's approved revisions, newest first.
      additionalProperties: false
      required: [data, total]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/RevisionSummary"
        total:
          type: integer
          format: int64
          minimum: 0
          description: How many approved revisions the entity has in all.
          examples:
            - 1
      examples:
        - data:
            - id: 42
              source: user
              summary: Credit the tune.
              author:
                display_name: Morwen
              contributors: []
              created_at: "2026-10-01T09:00:00Z"
          total: 1

    Revision:
      description: |
        A public revision with its snapshot views, in the shape of its `entity_type`: the entity as it is now,
        the snapshot, the base revision's snapshot and the fields that changed.
      oneOf:
        - $ref: "#/components/schemas/PieceRevision"
        - $ref: "#/components/schemas/PersonRevision"
        - $ref: "#/components/schemas/TermRevision"
        - $ref: "#/components/schemas/CollectionRevision"
        - $ref: "#/components/schemas/EventRevision"
      discriminator:
        propertyName: entity_type
        mapping:
          piece: "#/components/schemas/PieceRevision"
          person: "#/components/schemas/PersonRevision"
          term: "#/components/schemas/TermRevision"
          collection: "#/components/schemas/CollectionRevision"
          event: "#/components/schemas/EventRevision"
      examples:
        - entity_type: event
          id: 46
          entity:
            slug: midwinter-revel
            name: Midwinter Revel
            kind: event
          base_revision_id: null
          source: import
          summary: ""
          author: null
          contributors: []
          created_at: "2026-01-01T00:00:00Z"
          snapshot:
            name: Midwinter Revel
            kind: event
            description_md: null
          base_snapshot: null
          changed_fields: [kind, name]

    PieceRevision:
      type: object
      description: A public revision of a piece, with its snapshot views.
      additionalProperties: false
      required:
        - entity_type
        - id
        - entity
        - base_revision_id
        - source
        - summary
        - author
        - contributors
        - created_at
        - snapshot
        - base_snapshot
        - changed_fields
      properties:
